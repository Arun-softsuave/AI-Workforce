name: replan
title: The ticket or the design changed (W13) – re-plan before building, ask "adapt?" after
job: replan
steps:
  - summarise_change      # what changed: ticket lines added/removed, Figma exact values; written into the design document
  - name: context_pack    # before building: the plan is made again with the change
    when: not_built
  - name: plan
    when: not_built
  - name: plan_review
    when: not_built
  - name: plan_gate
    when: not_built
  - name: ask_adapt       # after building or after the PR: "adapt?" (adapted directly under "no approvals")
    when: built
