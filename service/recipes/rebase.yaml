name: rebase
title: Keep our PR mergeable (W13) – bring the base in the team's way, never force-push
job: rebase
steps:
  - rebase_prepare        # the PR's head and base fetched; a folder of this job's own (conflicts), or the item's folder (new commits)
  - rebase_apply          # merge the base in (a team that rebases is told – no force-push); simple conflicts resolved and tested, a real one stops and tells you
  - rebase_publish        # a normal push (never forced); agent-resolved conflicts are shown first; CI is watched again
