name: close
title: Close-out after the PR is merged (W14)
job: close
steps:
  - close_item            # NEW STEP (not in STEPS yet): item → DONE, Jira status/comment if allowed
  - unblock_dependents    # NEW STEP: items that depend on this one may start; tell you the next PR in the merge order
  - retarget_stacked      # NEW STEP: rebase and re-target stacked PRs to the base branch
  - record_memory         # learning: repeated review comments become rules, decisions go to the Brain
  - clean_worktree        # NEW STEP: remove this item's folder and local branch
